version: '3.8'

services:
  news-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news-app
    restart: always
    ports:
      - "80:5000"
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://sarthakwaghere23_db_user:Sarthak29@newsaggregator.fjamluq.mongodb.net/news-aggregator?retryWrites=true&w=majority}
      - JWT_SECRET=${JWT_SECRET:-news_aggregator_jwt_secret_dev_key}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/status').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - news-app

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
